<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Featured projects showcase</title>
<desc id="desc">Four futuristic project panels for an AI fitness coach, explainable hate speech research, developer portfolio, and Java algorithm solutions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset="1" stop-color="#17102c"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .h{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.sub{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.tag{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.num{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#fff}.ico{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#fff}
  </style>
</defs>
