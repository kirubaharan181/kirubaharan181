<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="Animated gradient divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="13" width="1000" height="2" fill="url(#line)" opacity="0.7"/>
  <circle cy="14" r="4" fill="#ffffff" filter="url(#g)">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#22d3ee;#a78bfa;#ec4899;#22d3ee" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(500 14) rotate(45)">
    <rect x="-6" y="-6" width="12" height="12" fill="#0b1020" stroke="#a78bfa" stroke-width="2"/>
    <rect x="-2.5" y="-2.5" width="5" height="5" fill="#ec4899">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
